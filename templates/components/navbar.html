<nav class="min-h-16 flex items-center justify-between px-5 py-2 sticky top-0 z-5 bg-background border-b border-border">
  <div>
    <label for="app-drawer" class="btn btn-square btn-outline rounded-lg border border-border hover:bg-base-200 [&>svg]:size-4">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 5L20 5"></path>
        <path d="M4 12L20 12"></path>
        <path d="M4 19L14 19"></path>
      </svg>

  <button popovertarget="popover-profile" style="anchor-name:--anchor-profile">
    <div class="avatar">
      <div class="w-9 rounded-full ring-2 ring-offset-2 ring-blue-500">
        <img alt="Tailwind-CSS-Avatar-component" src="https://img.daisyui.com/images/profile/demo/spiderperson@192.webp" />
      </div>
    </div>
  </button>
  <ul class="dropdown menu w-45 mt-2 mr-4 rounded-box bg-background border border-border shadow-lg" popover id="popover-profile" style="position-anchor:--anchor-profile">
    <li>
      <a>
        {% if request.user.is_authenticated %}
          {{ request.user.profile.first_name }}
        {% else %}
          Profile
        {% endif %}
      </a>
    </li>
    <li>
      <a>Item 2</a>
    </li>
    <hr class="my-2 border-t-border" />
    <li>
      <form action="{% url 'auth:logout' %}" method="post" class="auto-cols-fr hover:bg-red-500/10 text-red-500">
        {% csrf_token %}
        <button type="submit" class="flex items-center gap-x-2 cursor-pointer [&>svg]:size-5">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>Keluar
        </button>
      </form>
    </li>
  </ul>
</nav>
