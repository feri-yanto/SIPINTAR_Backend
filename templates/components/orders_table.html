<div class="overflow-x-auto">
  <table class="table">
    <thead>
      <tr>
        <th>Pelanggan</th>
        <th>Status</th>
        <th class="hidden md:table-cell">Tanggal</th>
        <th class="text-right">Jumlah</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for o in orders %}
      <tr class="hover:bg-base-300/40">
        <td>
          <div class="flex items-center gap-3">
            <div class="avatar avatar-placeholder">
              <div class="bg-neutral text-neutral-content w-9 rounded-full">
                <span class="text-xs">{{ o.customer|slice:":2"|upper }}</span>
              </div>
            </div>
            <div>
              <div class="font-medium">{{ o.customer }}</div>
              <div class="text-xs opacity-60">{{ o.email }}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-soft badge-{{ o.status_color }}">{{ o.status }}</span></td>
        <td class="hidden md:table-cell text-sm opacity-70">{{ o.date }}</td>
        <td class="text-right font-medium">{{ o.amount }}</td>
        <td class="text-right">
          <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-xs btn-square" aria-label="Aksi">⋯</div>
            <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 border border-base-300 rounded-box z-10 w-36 p-1 shadow-lg">
              <li><a>Detail</a></li>
              <li><a>Ubah</a></li>
              <li><a class="text-error">Hapus</a></li>
            </ul>
          </div>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-center opacity-60 py-8">Belum ada data.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
