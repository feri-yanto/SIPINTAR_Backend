{% load static %}

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />

  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme inline {
      --font-outfit: 'Outfit', sans-serif;
      --color-base-background: var(--base-background);
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-border: var(--border);
      --color-border-field: var(--border-field);
      --breakpoint-xs: 30rem;
    }

    :root {
      --base-background: oklch(98.5% 0.002 247.839);
      --background: oklch(100% 0 0);
      --foreground: oklch(27.8% 0.033 256.848);
      --border: oklch(92.8% 0.006 264.531);
      --border-field: oklch(87.2% 0.01 258.338);
    }
    
    .dark {
      --base-background: oklch(21% 0.034 264.665);
      --background: oklch(21% 0.034 264.665);
      --foreground: oklch(100% 0 0);
      --border: oklch(37.3% 0.034 259.733);
    }
  </style>

  {% block extra_head %}

  {% endblock %}
</head>
