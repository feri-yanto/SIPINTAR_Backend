{% load static %}

<!DOCTYPE html>
<html lang="id" data-theme="shadcn-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {{ title }}
    </title>
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon">

    <!-- daisyUI v5.7.50 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS v4.3 (browser build) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Icon -->

    <!-- Tema kustom: palet gelap ala shadcn/ui (neutral) -->
    <style type="text/tailwindcss">
      @theme inline {
        --color-base: var(--base);
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-border: var(--border);
      }
      
      :root {
        --base: rgb(249, 250, 252);
        --background: rgb(255, 255, 255);
        --foreground: oklch(27.8% 0.033 256.848);
        --border: oklch(92.8% 0.006 264.531);
      }
    </style>
    {% block extra_head %}

    {% endblock %}
  </head>
  <body class="min-h-dvh bg-base text-foreground antialiased">
    <div class="drawer lg:drawer-open">
      <input id="app-drawer" type="checkbox" class="drawer-toggle" />

      <div class="drawer-content flex flex-col">
        {% include '../components/navbar.html' %}

        <main class="p-4 md:p-6">
          {% block content %}

          {% endblock %}
        </main>
      </div>

      <div class="drawer-side">
        {% include '../components/sidebar.html' %}
      </div>
    </div>

    {% block extra_body %}

    {% endblock %}
  </body>
</html>
